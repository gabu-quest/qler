[project]
name = "qler"
version = "0.5.1"
description = "Async-first background job queue for Python, built on SQLite via sqler"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "gabu"}]
keywords = ["sqlite", "job-queue", "async", "background-tasks", "sqler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "sqler>=1.2026.11.2",
    "python-ulid>=3.0.0",
    "click>=8.0.0",
    "croniter>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/gabu-quest/qler"
Repository = "https://github.com/gabu-quest/qler"
Issues = "https://github.com/gabu-quest/qler/issues"
Changelog = "https://github.com/gabu-quest/qler/blob/main/CHANGELOG.md"

[project.optional-dependencies]
logler = ["logler>=1.3.0"]
metrics = [
    "prometheus-client>=0.20.0",
]

[project.scripts]
qler = "qler.cli:cli"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pydantic>=2.12.5",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "ruff==0.12.10",
    "types-croniter>=6.2.4.20261118",
]
bench = [
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
]

[tool.uv.sources]
sqler = { path = "../sqler", editable = true }

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.mypy]
files = ["src/qler"]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# logler ships no py.typed marker yet; its names are read as Any.
[[tool.mypy.overrides]]
module = ["logler.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "SIM",
    "ASYNC",
    "RUF",
    "B",
]
ignore = [
    "E501",
    # Public signatures keep `timeout=`: Job.wait, Job.wait_for_dependencies, Queue.enqueue
    # (the job's run timeout); the test helpers copy that name.
    "ASYNC109",
    # The only hits are the en dash in "0–100", which set_progress's error text and its
    # tests use on purpose.
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["N", "E501", "E402", "E731", "E741", "F841"]
"benchmarks/**/*" = ["N", "E501", "F841", "E402", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
