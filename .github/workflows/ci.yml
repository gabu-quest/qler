name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The publish workflow runs this file before it builds anything.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Tests • ${{ matrix.os }} • py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Install sqler from PyPI, not from the sibling checkout pyproject.toml names.
      UV_NO_SOURCES: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies (main + dev + extras)
        run: uv sync --dev --extra metrics --extra logler

      # --no-sync from here on: a plain `uv run` syncs again without the extras.
      - name: Show versions
        run: |
          uv run --no-sync python --version
          uv run --no-sync ruff --version
          uv run --no-sync pytest --version

      - name: Lint (ruff)
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy

      - name: Run tests
        timeout-minutes: 10
        env:
          PYTHONUTF8: "1"
        run: uv run --no-sync pytest -v --timeout=30 --timeout-method=thread -p no:cacheprovider --disable-warnings

  # The test jobs install the development packages. This one has only what
  # `pip install qler` brings, so a package qler needs and does not declare fails here.
  installed:
    name: Installed wheel, nothing else
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: uv build --wheel

      - name: Install the wheel alone into a new environment
        run: |
          uv venv "$RUNNER_TEMP/installed"
          uv pip install --python "$RUNNER_TEMP/installed/bin/python" dist/*.whl

      - name: Import every module and run one job, outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/tests/smoke_installed.py"
          "$RUNNER_TEMP/installed/bin/qler" --help
