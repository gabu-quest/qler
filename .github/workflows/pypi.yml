name: Publish (PyPI • Trusted Publishing)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag equals the package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tag must equal v + pyproject version
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match v${version} from pyproject.toml" >&2
            exit 1
          fi

  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    name: Build & Publish
    needs: [version, tests]
    runs-on: ubuntu-latest
    environment: pypi # must match the Environment name on the PyPI Trusted Publisher entry
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Build sdist/wheel
        run: |
          uv build
          ls -l dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
